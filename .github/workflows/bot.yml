name: Giants MiLB Transactions Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch and format without posting or changing state"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "10 * * * *"  # every hour at minute 10 UTC

concurrency:
  group: giants-milb-transactions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-transactions.txt

      - name: Install transaction bot deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-transactions.txt

      - name: Run bot
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: python bot.py

      - name: Commit updated transaction state
        if: always()
        run: |
          if [ ! -f transaction_state.json ]; then
            echo "No transaction state file."
            exit 0
          fi
          git add transaction_state.json
          if git diff --cached --quiet; then
            echo "No transaction state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update transaction state"
          git push
